[project]
name = "recursos-python-nova-ai"
version = "0.1.0"
description = "Ruta de capacitación en Python para el equipo de Nova AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
ia = [
    "anthropic",
    "langgraph",
    "crewai",
    "python-dotenv",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir>=0.1.3",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests", "ruta"]

[tool.ruff]
target-version = "py312"
line-length = 88
# El markdown es material didáctico: sus ejemplos están escritos para
# enseñar, no para pasar un formateador.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
