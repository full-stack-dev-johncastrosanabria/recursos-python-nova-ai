name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests contra las soluciones de referencia
        # Verifica que cada ejercicio publicado es realmente resoluble.
        env:
          NOVA_SOLUCIONES: "1"
        run: uv run pytest -v

      - name: Verificar que cada test tiene su pareja en ejercicios/ y soluciones/
        run: uv run python scripts/verificar_parejas.py

      - name: Verificar que la ruta falla sin soluciones (nadie dejó la respuesta puesta)
        run: |
          if uv run pytest ruta; then
            echo "Los tests de ruta/ pasaron SIN NOVA_SOLUCIONES=1."
            echo "Eso significa que algún stub en ejercicios/ ya trae la solución."
            exit 1
          fi
